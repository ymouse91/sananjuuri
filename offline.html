<!doctype html>
<html lang="fi">

    <meta name="theme-color" content="#f3f0e8">
    <title>Sanajuuri offline</title>
    <style>
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;

        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      main {
        max-width: 340px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1;
      }

      p {
        margin: 0;
        color: #6e6a61;
        font-size: 16px;
        line-height: 1.45;

  <body>
    <main>
      <h1>Sanajuuri</h1>
      <p>Peli ei ole vielä tallentunut tähän laitteeseen offline-käyttöä varten. Avaa peli kerran verkkoyhteydellä ja kokeile sen jälkeen uudelleen.</p>
